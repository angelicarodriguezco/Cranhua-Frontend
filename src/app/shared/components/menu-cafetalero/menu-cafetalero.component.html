<img class="logo" src="/images/logo-cranhua.png" alt="Crán̈hua" width="647" height="117" />

<nav class="menu" aria-label="Menú del cafetalero">
  @for (grupo of grupos; track $index) {
    <ul class="menu__grupo">
      @for (opcion of grupo; track opcion.ruta) {
        <li>
          <a
            class="menu__opcion"
            [routerLink]="opcion.ruta"
            routerLinkActive="menu__opcion--activa"
            ariaCurrentWhenActive="page"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="opcion.icono" />
            </svg>
            {{ opcion.texto }}
          </a>
        </li>
      }
    </ul>
  }
</nav>

<div class="usuario">
  <span class="usuario__avatar" aria-hidden="true">{{ iniciales() }}</span>
  <div>
    <p class="usuario__nombre">{{ nombre() }}</p>
    <p class="usuario__rol">Cafetalero</p>
  </div>
</div>

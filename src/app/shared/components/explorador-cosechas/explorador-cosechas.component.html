<div class="filtros" role="group" aria-label="Filtros rápidos">
  <button type="button" class="chip" [attr.aria-pressed]="sinFiltros()" (click)="limpiarFiltros()">
    Todas
  </button>
  <button
    type="button"
    class="chip"
    [attr.aria-pressed]="filtros().soloDisponibles"
    (click)="alternar('soloDisponibles')"
  >
    Disponible ahora
  </button>
  <select
    class="chip chip-zona"
    aria-label="Zona"
    [class.activo]="filtros().zona"
    (change)="elegirZona($event)"
  >
    <option value="" [selected]="!filtros().zona">Zona</option>
    @for (zona of zonas(); track zona) {
      <option [value]="zona" [selected]="zona === filtros().zona">{{ zona }}</option>
    }
  </select>
  <select
    class="chip chip-select"
    aria-label="Variedad"
    [class.activo]="filtros().variedad"
    (change)="elegirVariedad($event)"
  >
    <option value="" [selected]="!filtros().variedad">Variedad</option>
    @for (variedad of variedades(); track variedad) {
      <option [value]="variedad" [selected]="variedad === filtros().variedad">
        {{ variedad }}
      </option>
    }
  </select>
  <select
    class="chip chip-select"
    aria-label="Precio"
    [class.activo]="filtros().rangoPrecio"
    (change)="elegirPrecio($event)"
  >
    <option value="" [selected]="!filtros().rangoPrecio">Precio</option>
    @for (rango of rangosPrecio; track rango.id) {
      <option [value]="rango.id" [selected]="rango.id === filtros().rangoPrecio">
        {{ rango.etiqueta }}
      </option>
    }
  </select>
  <button
    type="button"
    class="chip"
    [attr.aria-pressed]="filtros().soloFlorales"
    (click)="alternar('soloFlorales')"
  >
    Notas florales
  </button>
  <button
    type="button"
    class="chip"
    [attr.aria-pressed]="filtros().soloHoney"
    (click)="alternar('soloHoney')"
  >
    Proceso honey
  </button>
</div>

<app-cuadricula-cosechas [cosechas]="cosechasFiltradas()" />

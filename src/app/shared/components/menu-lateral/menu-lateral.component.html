<aside class="menu-lateral" [attr.data-tema]="tema()">
  <div class="marca">
    <img class="logo" src="/images/logo-cranhua.png" alt="Cránhua" width="220" height="52" />
  </div>

  <div class="bloques">
    @for (bloque of bloques(); track bloque.rol) {
      <section class="bloque-rol" [attr.data-rol]="bloque.rol">
        @if (variosRoles()) {
          <h2 class="titulo-rol" [id]="'menu-rol-' + bloque.rol">{{ bloque.titulo }}</h2>
        }
        <nav
          class="nav-rol"
          [attr.aria-label]="variosRoles() ? null : 'Principal'"
          [attr.aria-labelledby]="variosRoles() ? 'menu-rol-' + bloque.rol : null"
        >
          @for (item of bloque.items; track item.ruta) {
            <ng-container
              [ngTemplateOutlet]="enlace"
              [ngTemplateOutletContext]="{ $implicit: item }"
            />
          }
        </nav>
      </section>
    }
  </div>

  <nav class="nav-cuenta" aria-label="Cuenta">
    @for (item of navCuenta; track item.ruta) {
      <ng-container [ngTemplateOutlet]="enlace" [ngTemplateOutletContext]="{ $implicit: item }" />
    }
  </nav>

  <div class="perfil">
    <span class="avatar" aria-hidden="true">{{ perfil().iniciales }}</span>
    <div class="perfil-texto">
      <span class="perfil-nombre">{{ perfil().nombreCompleto }}</span>
      <span class="perfil-rol">{{ perfil().roles }}</span>
    </div>
  </div>
</aside>

<ng-template #enlace let-item>
  <a
    [routerLink]="item.ruta"
    [class.activo]="activa() === item.ruta"
    [attr.aria-current]="activa() === item.ruta ? 'page' : null"
  >
    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      @switch (item.icono) {
        @case ('home') {
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" />
        }
        @case ('fincas') {
          <path d="M12 20V11" />
          <path d="M12 14c-3.5 0-6-2.2-6-5.2 2.8 0 5.2 1.2 6 3.2" />
          <path d="M12 14c3.5 0 6-2.2 6-5.2-2.8 0-5.2 1.2-6 3.2" />
          <path d="M12 10.5C10.2 8 9 5.8 9.4 3.8c2.4.4 4 2.4 4.6 4.7" />
        }
        @case ('cosecha') {
          <circle cx="12" cy="12" r="8.25" />
          <path d="M12 8v8M8 12h8" />
        }
        @case ('historial') {
          <circle cx="12" cy="12" r="8.25" />
          <path d="M12 7.5V12l3 2" />
        }
        @case ('explorar') {
          <circle cx="11" cy="11" r="6.25" />
          <path d="m20 20-4.5-4.5" />
        }
        @case ('solicitudes') {
          <path
            d="M9 4.5H7.5A1.5 1.5 0 0 0 6 6v13.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H15"
          />
          <rect x="9" y="3" width="6" height="3" rx="1" />
          <path d="M9.5 11h5M9.5 15h5" />
        }
        @case ('tostados') {
          <ellipse cx="12" cy="12" rx="5.5" ry="8.25" transform="rotate(35 12 12)" />
          <path d="M8.6 17.2c2.6-1.6 2.2-4.4 3.4-6.2 1.1-1.7 2.7-2.6 3.4-4.2" />
        }
        @case ('negocio') {
          <path d="M4.5 9.5 6 4.5h12l1.5 5" />
          <path d="M4.5 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0" />
          <path d="M5.5 11.5V20h13v-8.5M10 20v-4.5h4V20" />
        }
        @case ('pedidos') {
          <path d="M4 7.75 12 3.5l8 4.25v8.5L12 20.5l-8-4.25z" />
          <path d="m4 7.75 8 4.25 8-4.25M12 12v8.5" />
        }
        @case ('cafeteria') {
          <path d="M5 9.5h11V14a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z" />
          <path d="M16 11h1.25a2.25 2.25 0 0 1 0 4.5H16M9 3.5V6M12.5 3.5V6" />
        }
        @case ('registrar') {
          <circle cx="12" cy="12" r="8.25" />
          <path d="M12 8v8M8 12h8" />
        }
        @case ('perfil') {
          <circle cx="12" cy="8" r="3.25" />
          <path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" />
        }
        @case ('logout') {
          <path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10" />
          <path d="M10 12h9M15.5 8.5 19 12l-3.5 3.5" />
        }
      }
    </svg>
    <span>{{ item.etiqueta }}</span>
  </a>
</ng-template>

<section id="como-funciona" class="como" aria-labelledby="como-titulo">
  <header class="como__cabecera">
    <p class="como__etiqueta">Cómo funciona</p>
    <h2 id="como-titulo" class="como__titulo">De la cosecha al escaneo, en cuatro pasos</h2>
    <p class="como__intro">
      Crán̈hua conecta a cada actor de la cadena con un registro simple y trazable.
    </p>
  </header>

  <ol class="como__linea">
    @for (paso of pasos; track paso.num) {
      <li class="como__paso">
        <span class="como__num">{{ paso.num }}</span>
        <h3 class="como__paso-titulo">{{ paso.titulo }}</h3>
        <p class="como__paso-texto">{{ paso.texto }}</p>
      </li>
    }
  </ol>
</section>

<section id="inicio" class="portada" aria-labelledby="portada-marca">
  <h1 id="portada-marca" class="portada__marca">
    <img
      class="portada__logo"
      src="/images/logo-cranhua.png"
      alt="Crán̈hua"
      width="480"
      height="120"
    />
  </h1>
  <p class="portada__lema">De la finca a la taza</p>
  <p class="portada__desc">
    Trazabilidad completa del café costarricense: desde la finca hasta la taza, conectando
    cafetaleros, tostadores, cafeterías y consumidores.
  </p>
  <p class="portada__origen">Un proyecto de trazabilidad cafetalera — Costa Rica</p>

  <div class="portada__acciones">
    <a routerLink="/registro" class="btn btn--outline">Registro</a>
    <a href="#como-funciona" class="btn btn--filled">Ver cómo funciona</a>
    <a routerLink="/iniciar-sesion" class="btn btn--outline">Iniciar sesión</a>
  </div>

  <a routerLink="/explorar" class="portada__explorar">Explorar sin registrarse</a>
</section>

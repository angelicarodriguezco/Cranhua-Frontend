<div class="mis-fincas" [attr.data-theme]="tema()">
  <app-menu-lateral />

  <main class="contenido">
    <header class="cabecera">
      <div>
        <h1>Mis fincas</h1>
        <p>Estas son las fincas que tenés registradas en Cránhua.</p>
      </div>
      <a [routerLink]="rutaRegistrar" class="cta">+ Registrar finca</a>
    </header>

    <section class="fincas-grid" aria-label="Fincas registradas">
      @for (finca of fincas(); track finca.id) {
        <app-tarjeta-finca [finca]="finca" />
      }

      <a [routerLink]="rutaRegistrar" class="nueva-finca">
        <span class="nueva-finca__icono" aria-hidden="true">+</span>
        <span>Registrar nueva finca</span>
      </a>
    </section>
  </main>
</div>

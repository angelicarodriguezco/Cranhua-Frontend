<section class="login">
  <div class="login__panel">
    <div class="login__encabezado">
      <a routerLink="/" class="login__volver">← Volver</a>
      <img
        class="login__logo"
        src="/images/logo-cranhua.png"
        alt="Crán̈hua"
        width="160"
        height="40"
      />
    </div>

    <div class="login__contenido">
      <h1 class="login__titulo">Iniciar sesión</h1>

      <form class="login__form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <div class="campo">
          <label class="campo__etiqueta" for="correo">Correo electrónico</label>
          <input
            id="correo"
            class="campo__control"
            type="email"
            formControlName="correo"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            [attr.aria-invalid]="campoInvalido('correo')"
            [attr.aria-describedby]="campoInvalido('correo') ? 'error-correo' : null"
          />
          @if (campoInvalido('correo')) {
            <p id="error-correo" class="campo__error">Campo requerido</p>
          }
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="contrasena">Contraseña</label>
          <input
            id="contrasena"
            class="campo__control"
            type="password"
            formControlName="contrasena"
            placeholder="••••••••"
            autocomplete="current-password"
            [attr.aria-invalid]="campoInvalido('contrasena')"
            [attr.aria-describedby]="campoInvalido('contrasena') ? 'error-contrasena' : null"
          />
          @if (campoInvalido('contrasena')) {
            <p id="error-contrasena" class="campo__error">Campo requerido</p>
          }
          <a class="login__olvidaste" href="#" (click)="$event.preventDefault()">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <button type="submit" class="login__cta">Iniciar sesión</button>
      </form>

      <div class="login__separador" aria-hidden="true">
        <span class="login__separador-linea"></span>
        <span class="login__separador-texto">o</span>
        <span class="login__separador-linea"></span>
      </div>

      <button type="button" class="login__google">
        <svg class="login__google-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        Continuar con Google
      </button>

      <p class="login__registro">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="login__registro-enlace">Crear cuenta</a>
      </p>
    </div>
  </div>

  <div class="login__visual" aria-hidden="true">
    <img class="login__imagen" src="/images/login-cafe.jpg" alt="" />
  </div>
</section>

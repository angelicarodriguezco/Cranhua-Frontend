@switch (apiCargada()) {
  @case (true) {
    <google-map
      width="100%"
      height="100%"
      [center]="centro()"
      [options]="opciones"
      (mapInitialized)="encuadrar($event)"
    >
      <map-polygon [paths]="perimetro()" [options]="estilo" />
    </google-map>
  }
  @case (false) {
    <div class="aviso">
      <p>
        No se pudo cargar Google Maps. Revisá que <code>GOOGLE_MAPS_API_KEY</code> esté en el
        <code>.env</code>.
      </p>
    </div>
  }
  @default {
    <div class="aviso"><p>Cargando mapa…</p></div>
  }
}

<span class="area">≈ {{ area() }}</span>
